name: Retail Data Engineering CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate dbt and Airflow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install \
            dbt-core==1.12.0 \
            dbt-snowflake==1.12.1

      - name: Validate Airflow DAG syntax
        run: |
          python -m py_compile airflow/dags/retail_dbt_pipeline.py
      
      - name: Validate operational health-check syntax
        run: |
          python -m py_compile python/ops/retail_pipeline_health.py

      - name: Create CI dbt profile
        run: |
          mkdir -p "$HOME/.dbt"

          cat > "$HOME/.dbt/profiles.yml" <<'PROFILE'
          retail_dbt:
            outputs:
              ci:
                account: "ci-placeholder"
                database: "RETAIL_DW"
                role: "ACCOUNTADMIN"
                schema: "DBT_CI"
                threads: 4
                type: "snowflake"
                user: "ci-placeholder"
                password: "ci-placeholder"
                warehouse: "COMPUTE_WH"
            target: ci
          PROFILE

      - name: Validate dbt project
        working-directory: dbt/retail_dbt
        run: |
          dbt parse --no-partial-parse

  snowflake-integration:
    name: Snowflake dbt Integration
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install \
            dbt-core==1.12.0 \
            dbt-snowflake==1.12.1

      - name: Run dbt build against Snowflake
        working-directory: dbt/retail_dbt
        env:
          DBT_PROFILES_DIR: ${{ runner.temp }}/.dbt
          AIRFLOW_RUN_ID: github-actions-${{ github.run_id }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
        run: |
          mkdir -p "$DBT_PROFILES_DIR"

          for name in \
            SNOWFLAKE_ACCOUNT \
            SNOWFLAKE_USER \
            SNOWFLAKE_PASSWORD \
            SNOWFLAKE_ROLE \
            SNOWFLAKE_WAREHOUSE \
            SNOWFLAKE_DATABASE \
            SNOWFLAKE_SCHEMA
          do
            if [ -n "${!name}" ]; then
              echo "$name=SET"
            else
              echo "$name=MISSING"
              exit 1
            fi
          done

          cat > "$DBT_PROFILES_DIR/profiles.yml" <<'PROFILE'
          retail_dbt:
            outputs:
              ci:
                account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
                database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
                role: "{{ env_var('SNOWFLAKE_ROLE') }}"
                schema: "{{ env_var('SNOWFLAKE_SCHEMA') }}"
                threads: 4
                type: "snowflake"
                user: "{{ env_var('SNOWFLAKE_USER') }}"
                password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
                warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
            target: ci
          PROFILE

          dbt build \
            --no-partial-parse \
            --vars "{\"airflow_run_id\": \"${AIRFLOW_RUN_ID}\"}"
