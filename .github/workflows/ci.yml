name: Retail Data Engineering CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate dbt and Airflow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install \
            dbt-core==1.12.0 \
            dbt-snowflake==1.12.1

      - name: Validate Airflow DAG syntax
        run: |
          python -m py_compile airflow/dags/retail_dbt_pipeline.py

      - name: Validate dbt project
        working-directory: dbt/retail_dbt
        run: |
          dbt parse --no-partial-parse
