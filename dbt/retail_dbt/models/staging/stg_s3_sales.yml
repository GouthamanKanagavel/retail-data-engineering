version: 2

models:
  - name: stg_s3_sales
    description: "Deduplicated latest S3 sales snapshot."

    columns:
      - name: order_item_id
        description: "Unique order item identifier."
        tests:
          - not_null
          - unique

      - name: order_id
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null

      - name: quantity
        tests:
          - not_null

      - name: unit_price
        tests:
          - not_null

      - name: discount
        tests:
          - not_null

      - name: line_amount
        tests:
          - not_null

      - name: source_file
        tests:
          - not_null

      - name: ingested_at
        tests:
          - not_null