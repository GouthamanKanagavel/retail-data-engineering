version: 2

models:
  - name: stg_customers
    description: "Cleaned customer records from the RAW layer."
    columns:
      - name: customer_id
        description: "Unique customer identifier."
        tests:
          - not_null
          - unique

  - name: stg_products
    description: "Cleaned product records from the RAW layer."
    columns:
      - name: product_id
        description: "Unique product identifier."
        tests:
          - not_null
          - unique

  - name: stg_stores
    description: "Cleaned store records from the RAW layer."
    columns:
      - name: store_id
        description: "Unique store identifier."
        tests:
          - not_null
          - unique

  - name: stg_orders
    description: "Deduplicated and validated order records."
    columns:
      - name: order_id
        description: "Unique order identifier."
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: store_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stores')
                field: store_id

  - name: stg_order_items
    description: "Validated order line items."
    columns:
      - name: order_item_id
        description: "Unique order line identifier."
        tests:
          - not_null
          - unique

      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: quantity
        description: "Positive quantity purchased for the order item."
        tests:
          - not_null

      - name: unit_price
        description: "Unit selling price for the order item."
        tests:
          - not_null

      - name: discount
        description: "Discount amount applied to the order item."
        tests:
          - not_null

      - name: line_amount
        description: "Source line amount after discount."
        tests:
          - not_null

  - name: stg_payments
    description: "Validated payment records."
    columns:
      - name: payment_id
        description: "Unique payment identifier."
        tests:
          - not_null
          - unique

      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
