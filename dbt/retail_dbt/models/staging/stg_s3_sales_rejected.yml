version: 2

models:
  - name: stg_s3_sales_rejected
    description: "S3 sales records rejected from the trusted fact layer because required warehouse relationships are missing."

    columns:
      - name: order_item_id
        tests:
          - not_null
          - unique

      - name: order_id
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null

      - name: rejection_reason
        tests:
          - not_null
