version: 2

models:
  - name: int_s3_sales_quality_audit
    description: "Run-level audit metrics for the S3 sales ingestion and trusted fact pipeline."

    columns:
      - name: audit_timestamp
        tests:
          - not_null

      - name: raw_rows
        tests:
          - not_null

      - name: staged_rows
        tests:
          - not_null

      - name: validated_rows
        tests:
          - not_null

      - name: fact_rows
        tests:
          - not_null

      - name: fact_reconciliation_status
        tests:
          - not_null
          - accepted_values:
              values:
                - PASS
                - FAIL
