version: 2

models:
  - name: int_s3_sales_all_rejected
    description: "Unified S3 sales rejection layer covering data-quality and referential-integrity failures."

    columns:
      - name: order_item_id
        tests:
          - not_null

      - name: rejection_reason
        tests:
          - not_null
          - accepted_values:
              values:
                - INVALID_QUANTITY
                - INVALID_UNIT_PRICE
                - INVALID_DISCOUNT
                - MISSING_ORDER
                - MISSING_PRODUCT
                - UNKNOWN
