version: 2

models:
  - name: int_s3_sales_reconciliation
    description: "Compares the deduplicated S3 sales feed with the existing trusted fact."

    columns:
      - name: order_item_id
        tests:
          - not_null
          - unique

      - name: reconciliation_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - MATCH
                  - NEW_TO_FACT
                  - VALUE_MISMATCH
